<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolFlow AI Demo</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .phone-frame { width: 375px; height: 667px; background: white; border-radius: 30px; border: 10px solid #333; overflow: hidden; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.2); display: flex; flex-direction: column; }
        .header { background-color: #06C755; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 18px;}
        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #97baec; }
        .message { padding: 10px 15px; border-radius: 20px; max-width: 80%; font-size: 14px; line-height: 1.4; position: relative; word-wrap: break-word; }
        .bot { background-color: white; align-self: flex-start; border-bottom-left-radius: 5px; color: black; }
        .user { background-color: #06C755; color: white; align-self: flex-end; border-bottom-right-radius: 5px; }
        .input-area { padding: 10px; border-top: 1px solid #ddd; display: flex; gap: 10px; background: white; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { padding: 10px 20px; background-color: #06C755; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .typing { font-size: 12px; color: #fff; margin-left: 10px; display: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        .chat-image { width: 100%; border-radius: 10px; margin-top: 5px; border: 1px solid #ddd; cursor: pointer; }
        .link-btn { display: inline-block; margin-top: 5px; padding: 5px 10px; background: #eee; color: #333; text-decoration: none; border-radius: 5px; font-size: 12px; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="phone-frame">
    <div class="header">SchoolFlow AI (Admin)</div>
    <div class="chat-area" id="chatBox">
        <div class="message bot">
            สวัสดีค่ะ! 🙏 SchoolFlow AI ยินดีให้บริการค่ะ <br><br>
            คุยเล่นกับหนูได้ หรือจะสั่งงานก็ได้นะคะ เช่น:<br>
            👉 <b>"ตารางสอน"</b><br>
            👉 <b>"ร่างหนังสือขอเชิญวิทยากร"</b>
        </div>
    </div>
    <div class="typing" id="typingIndicator">SchoolFlow AI กำลังพิมพ์...</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="พิมพ์ข้อความ..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">ส่ง</button>
    </div>
</div>

<script>
    function handleEnter(e) { if(e.key === 'Enter') sendMessage(); }

    function sendMessage() {
        let input = document.getElementById("userInput");
        let chatBox = document.getElementById("chatBox");
        let text = input.value.trim();
        
        if (text === "") return;

        // User Message
        let userDiv = document.createElement("div");
        userDiv.className = "message user";
        userDiv.innerText = text;
        chatBox.appendChild(userDiv);
        input.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        // Typing Simulation
        document.getElementById("typingIndicator").style.display = "block";
        
        setTimeout(() => {
            document.getElementById("typingIndicator").style.display = "none";
            let botDiv = document.createElement("div");
            botDiv.className = "message bot";
            
            // ==========================================
            // LOGIC การตอบโต้ (Smart Logic)
            // ==========================================
            
            // 1. เช็คคำสั่งหลักก่อน (Priority สูงสุด)
            if (text.includes("ตารางสอน") || text.includes("ตารางเรียน")) {
                botDiv.innerHTML = `รับทราบค่ะ! นี่คือตารางสอนของเทอมนี้ค่ะ 📅<br>
                                    <img src="schedule.jpg" class="chat-image" onclick="window.open(this.src)" onerror="this.style.display='none'; this.parentElement.innerHTML+='<br>(ไม่พบรูป schedule.jpg ในระบบ)'">
                                    <br><span style="font-size:12px; color:gray;">(คลิกที่รูปเพื่อขยาย)</span>`;
            
            } else if (text.includes("ร่าง") || text.includes("หนังสือ") || text.includes("บันทึกข้อความ")) {
                botDiv.innerHTML = `📝 รับทราบค่ะ! กำลังดำเนินการร่างหนังสือเรื่อง <b>'${text}'</b> ให้อย่างเร่งด่วน...<br><br>
                                    ✅ เสร็จเรียบร้อยค่ะ<br>
                                    <a href="#" class="link-btn">⬇️ ดาวน์โหลดไฟล์ Word (.docx)</a>`;
            
            // 2. เช็คบทสนทนาทั่วไป (General Conversation)
            } else if (text.includes("สวัสดี") || text.includes("ดีจ้า") || text.includes("ฮัลโหล")) {
                botDiv.innerText = "สวัสดีค่ะอาจารย์! วันนี้มีอะไรให้หนูช่วยไหมคะ? หรือจะคุยเล่นแก้เหงาก็ได้นะคะ 😊";

            } else if (text.includes("ขอบคุณ") || text.includes("ขอบใจ")) {
                botDiv.innerText = "ยินดีเสมอค่ะ! เป็นหน้าที่ของ SchoolFlow AI อยู่แล้วค่ะ 💖";

            } else if (text.includes("ชื่ออะไร") || text.includes("คือใคร")) {
                botDiv.innerText = "หนูชื่อ SchoolFlow AI ค่ะ เป็นผู้ช่วยอัจฉริยะที่ถูกพัฒนาขึ้นเพื่อช่วยลดภาระงานเอกสารของครูไทยค่ะ 🤖";

            } else if (text.includes("เหนื่อย") || text.includes("ท้อ")) {
                botDiv.innerText = "สู้ๆ นะคะอาจารย์! ✌️ พักดื่มน้ำเย็นๆ สักแก้ว แล้วค่อยลุยต่อ หนูเป็นกำลังใจให้ค่ะ";

            } else if (text.includes("เก่ง") || text.includes("สุดยอด")) {
                botDiv.innerText = "ขอบคุณค่ะ! เขินจังเลย 😳 หนูจะพยายามพัฒนาตัวเองให้เก่งขึ้นไปอีกค่ะ";

            // 3. ถ้าไม่เข้าเงื่อนไขอะไรเลย (Fallback - ตอบกลางๆ ให้ดูเนียน)
            } else {
                const randomAnswers = [
                    "รับทราบค่ะ หนูบันทึกข้อมูลนี้ไว้เรียบร้อยแล้วค่ะ ✅",
                    "น่าสนใจมากค่ะอาจารย์ ช่วยเล่ารายละเอียดเพิ่มเติมอีกนิดได้ไหมคะ?",
                    "เรื่องนี้อาจต้องตรวจสอบระเบียบกระทรวงเพิ่มเติม เดี๋ยวหนูเช็กให้นะคะ",
                    "เข้าใจแล้วค่ะ ระบบกำลังประมวลผลข้อมูลดังกล่าวเพื่อนำไปปรับปรุงค่ะ 📝"
                ];
                // สุ่มคำตอบ 1 ใน 4 ข้อข้างบน
                botDiv.innerText = randomAnswers[Math.floor(Math.random() * randomAnswers.length)];
            }
            // ==========================================

            chatBox.appendChild(botDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000); // ดีเลย์ 1 วินาทีให้ดูเหมือนคิด
    }
</script>

</body>
</html>
